services:
    web1:
        image: daphne-truimp-card-game:latest
        build: ./backend
        container_name: truimp-card-game-container-1
        command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
        expose:
            - 8000
        volumes:
            - ./backend:/app
        depends_on:
            - redis

    web2:
        image: daphne-truimp-card-game:latest
        container_name: truimp-card-game-container-2
        command: daphne -b 0.0.0.0 -p 8001 backend.asgi:application
        expose:
            - 8001
        volumes:
            - ./backend:/app
        depends_on:
            - redis

    nginx:
        image: nginx:latest
        container_name: nginx-container
        ports:
            - 8080:8080
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./backend/staticfiles:/app/static
        depends_on:
            - web1
            - web2

    redis:
        image: redis:7-alpine
        container_name: truimp-card-game-redis
        expose:
            - 6379
