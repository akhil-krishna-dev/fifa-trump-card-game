# events {}

# http {
#     include mime.types;

    upstream daphne_servers {
        ip_hash;

        server web1:8000;
        server web2:8001;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://daphne_servers;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
        }

        location /static/ {
            alias /app/static/;
        }

    }
# }